
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  # === Set these in Azure DevOps (variable group or pipeline variables) ===
  azureServiceConnection: 'YOUR-AZURE-RM-SC'
  resourceGroupName: 'rg-stockml-mvp'
  location: 'westeurope'

  # Global unique names (set as variables or in variable group)
  acrName: 'youruniqueacrname'
  functionAppName: 'youruniquefuncappname'
  storageAccountName: 'youruniquestoragename'

  # App names
  namePrefix: 'stockml'
  apiRepoName: '$(namePrefix)-api'

  blobContainerName: 'stockml'
  timerSchedule: '0 0 1 * * *'
  omx30Symbols: 'ERIC-B,VOLV-B,ATCO-A,ATCO-B,SAND,SEB-A,SWED-A,SHB-A,NDA-SE,TELIA'

stages:
- stage: Infra
  displayName: 'Deploy Infra (Bicep)'
  jobs:
  - job: DeployInfra
    steps:
    - checkout: self
    - task: AzureCLI@2
      displayName: 'az deployment group create (Bicep)'
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          az group create -n $(resourceGroupName) -l $(location)

          DEPLOYMENT_NAME="stockml-$(Build.BuildId)"
          az deployment group create             --name $DEPLOYMENT_NAME             --resource-group $(resourceGroupName)             --template-file infra/bicep/main.bicep             --parameters               location=$(location)               namePrefix=$(namePrefix)               acrName=$(acrName)               functionAppName=$(functionAppName)               storageAccountName=$(storageAccountName)               blobContainerName=$(blobContainerName)               timerSchedule='$(timerSchedule)'               omx30Symbols='$(omx30Symbols)'

          OUT=$(az deployment group show -g $(resourceGroupName) -n $DEPLOYMENT_NAME --query properties.outputs -o json)
          echo "$OUT"

          containerAppName=$(echo $OUT | python -c "import sys,json; o=json.load(sys.stdin); print(o['containerAppName']['value'])")
          functionAppNameOut=$(echo $OUT | python -c "import sys,json; o=json.load(sys.stdin); print(o['functionAppName']['value'])")
          acrLoginServer=$(echo $OUT | python -c "import sys,json; o=json.load(sys.stdin); print(o['acrLoginServer']['value'])")

          echo "##vso[task.setvariable variable=containerAppName;isOutput=true]$containerAppName"
          echo "##vso[task.setvariable variable=functionAppNameOut;isOutput=true]$functionAppNameOut"
          echo "##vso[task.setvariable variable=acrLoginServer;isOutput=true]$acrLoginServer"
      name: setOutputs

- stage: API
  displayName: 'Build & Deploy FastAPI to Azure Container Apps'
  dependsOn: Infra
  variables:
    containerAppName: $[ stageDependencies.Infra.DeployInfra.outputs['setOutputs.containerAppName'] ]
    acrLoginServer: $[ stageDependencies.Infra.DeployInfra.outputs['setOutputs.acrLoginServer'] ]
  jobs:
  - job: BuildDeployApi
    steps:
    - checkout: self
    - task: AzureContainerApps@1
      displayName: 'Build and deploy API to Container Apps'
      inputs:
        azureSubscription: $(azureServiceConnection)
        resourceGroup: $(resourceGroupName)
        acrName: $(acrName)
        containerAppName: $(containerAppName)
        appSourcePath: '$(Build.SourcesDirectory)/src/api'
        imageToBuild: '$(acrLoginServer)/$(apiRepoName):$(Build.BuildId)'
        imageToDeploy: '$(acrLoginServer)/$(apiRepoName):$(Build.BuildId)'

- stage: Functions
  displayName: 'Build & Deploy Azure Functions (Python)'
  dependsOn: Infra
  variables:
    functionAppNameOut: $[ stageDependencies.Infra.DeployInfra.outputs['setOutputs.functionAppNameOut'] ]
  jobs:
  - job: BuildDeployFunctions
    steps:
    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'

    - script: |
        set -euo pipefail
        cd src/functions
        python -m pip install --upgrade pip
        # Install dependencies into .python_packages for zip deploy
        pip install --target=".python_packages/lib/site-packages" -r requirements.txt
      displayName: 'Install Python deps into .python_packages'

    - task: ArchiveFiles@2
      displayName: 'Archive Functions app'
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)/src/functions'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/functions.zip'
        replaceExistingArchive: true

    - task: AzureFunctionApp@2
      displayName: 'Deploy Functions via Zip'
      inputs:
        azureSubscription: $(azureServiceConnection)
        appType: functionAppLinux
        appName: $(functionAppNameOut)
        package: '$(Build.ArtifactStagingDirectory)/functions.zip'

- stage: Bootstrap
  displayName: 'Bootstrap model + folders in Blob (first run)'
  dependsOn:
    - Infra
    - API
    - Functions
  jobs:
  - job: BootstrapArtifacts
    steps:
    - checkout: self
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'

    - task: AzureCLI@2
      displayName: 'Create and upload baseline model + pointers'
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install joblib numpy pandas scikit-learn mapie azure-identity azure-storage-blob pyarrow

          python tools/bootstrap_model.py             --storage-account $(storageAccountName)             --container $(blobContainerName)             --models-prefix models/omx30/horizon=7             --features-prefix curated/omx30/features/horizon=7
