
trigger:
  branches:
    include:
    - main
  paths:
    include:
    - infra/
    - src/

pr:
  branches:
    include:
    - main

parameters:
- name: targetEnvironment
  displayName: 'Target Environment for Deployment'
  type: string
  default: dev
  values:
  - dev
  - test
  - prod

variables:
- group: ${{ parameters.targetEnvironment }}-vars
- name: namePrefix
  value: stockml


pool:
  vmImage: ubuntu-latest

stages:
- stage: Infra
  displayName: 'Deploy Infra (Bicep)'
  jobs:
  - job: DeployInfra
    steps:
    - checkout: self
    - task: AzureCLI@2
      displayName: 'az deployment group create (Bicep)'
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          # -----------------------------
          # Variables
          # -----------------------------
          IMAGE_NAME="$(namePrefix)-api"
          IMAGE_FULL="$(acrName).azurecr.io/$IMAGE_NAME"

          echo "Using image: $IMAGE_FULL"
          echo "Tags: ${{ parameters.targetEnvironment }}"

          # -----------------------------
          # Login to ACR
          # -----------------------------
          az acr login --name $(acrName)

          # -----------------------------
          # Build image with two tags
          # -----------------------------
          docker build \
            -t $IMAGE_FULL:${{ parameters.targetEnvironment }} \
            kunskapskontroll_ai_kurs_2/del_2/src/api

          # -----------------------------
          # Push both tags
          # -----------------------------
          docker push $IMAGE_FULL:${{ parameters.targetEnvironment }}

          az group create -n $(resourceGroupName) -l $(location)

          DEPLOYMENT_NAME="infra-${{ parameters.targetEnvironment }}-$(Build.BuildId)"
          az deployment group create \
            --name $DEPLOYMENT_NAME \
            --resource-group $(resourceGroupName) \
            --template-file kunskapskontroll_ai_kurs_2/del_2/src/infra/main.bicep \
            --parameters kunskapskontroll_ai_kurs_2/del_2/src/infra/environments/${{ parameters.targetEnvironment }}/parameters.json imageTag=${{ parameters.targetEnvironment }}

          OUT=$(az deployment group show -g $(resourceGroupName) -n $DEPLOYMENT_NAME --query properties.outputs -o json)
          echo "$OUT"

          containerAppName=$(echo $OUT | python -c "import sys,json; o=json.load(sys.stdin); print(o['containerAppName']['value'])")
          functionAppNameOut=$(echo $OUT | python -c "import sys,json; o=json.load(sys.stdin); print(o['functionAppName']['value'])")
          acrLoginServer=$(echo $OUT | python -c "import sys,json; o=json.load(sys.stdin); print(o['acrLoginServer']['value'])")          
          storageAccountName=$(echo $OUT | python -c "import sys,json; o=json.load(sys.stdin); print(o['storageAccountName']['value'])")
          blobContainerName=$(echo $OUT | python -c "import sys,json; o=json.load(sys.stdin); print(o['blobContainerName']['value'])")


          echo "##vso[task.setvariable variable=containerAppName;isOutput=true]$containerAppName"
          echo "##vso[task.setvariable variable=functionAppNameOut;isOutput=true]$functionAppNameOut"
          echo "##vso[task.setvariable variable=acrLoginServer;isOutput=true]$acrLoginServer"
          echo "##vso[task.setvariable variable=storageAccountName;isOutput=true]$storageAccountName"
          echo "##vso[task.setvariable variable=blobContainerName;isOutput=true]$blobContainerName"
      name: setOutputs

- stage: API
  displayName: 'Build & Deploy FastAPI to Azure Container Apps'
  dependsOn: Infra
  variables:
    containerAppName: $[ stageDependencies.Infra.DeployInfra.outputs['setOutputs.containerAppName'] ]
    acrLoginServer: $[ stageDependencies.Infra.DeployInfra.outputs['setOutputs.acrLoginServer'] ]
  jobs:
  - job: BuildDeployApi
    steps:
    - checkout: self
    - task: AzureContainerApps@1
      displayName: 'Build and deploy API to Container Apps'
      inputs:
        azureSubscription: $(azureServiceConnection)
        resourceGroup: $(resourceGroupName)
        acrName: $(acrName)
        containerAppName: $(containerAppName)
        appSourcePath: '$(Build.SourcesDirectory)/kunskapskontroll_ai_kurs_2/del_2/src/api'
        imageToBuild: '$(acrLoginServer)/$(namePrefix)-api:$(Build.BuildId)'
        imageToDeploy: '$(acrLoginServer)/$(namePrefix)-api:$(Build.BuildId)'

- stage: Functions
  displayName: 'Build & Deploy Azure Functions (Python)'
  dependsOn: Infra
  variables:
    functionAppNameOut: $[ stageDependencies.Infra.DeployInfra.outputs['setOutputs.functionAppNameOut'] ]
  jobs:
  - job: BuildDeployFunctions
    steps:
    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'

    - script: |
        set -euo pipefail
        python -m pip install --upgrade pip
        # Install dependencies into .python_packages for zip deploy
        pip install --target=".python_packages/lib/site-packages" -r requirements.txt
      displayName: 'Install Python deps into .python_packages'
      workingDirectory: $(Build.SourcesDirectory)/kunskapskontroll_ai_kurs_2/del_2/src/functions

    - task: ArchiveFiles@2
      displayName: 'Archive Functions app'
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)/kunskapskontroll_ai_kurs_2/del_2/src/functions'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/functions.zip'
        replaceExistingArchive: true

    - task: AzureCLI@2
      displayName: 'Deploy Functions via Zip (Linux Consumption)'
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          az functionapp deployment source config-zip \
            --resource-group rg-kunskapskontroll-ai-kurs-2-${{ parameters.targetEnvironment }} \
            --name $(functionAppNameOut) \
            --src $(Build.ArtifactStagingDirectory)/functions.zip

- stage: Bootstrap
  displayName: 'Bootstrap model + folders in Blob (first run)'
  dependsOn:
    - Infra
    - API
    - Functions  
  variables:
      storageAccountName: $[ stageDependencies.Infra.DeployInfra.outputs['setOutputs.storageAccountName'] ]
      blobContainerName:  $[ stageDependencies.Infra.DeployInfra.outputs['setOutputs.blobContainerName'] ]
  jobs:
  - job: BootstrapArtifacts
    steps:
    - checkout: self
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'

    - task: AzureCLI@2
      displayName: 'Create and upload baseline model + pointers'
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(Build.SourcesDirectory)/kunskapskontroll_ai_kurs_2/del_2
        inlineScript: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install joblib numpy pandas scikit-learn mapie lightgbm azure-identity azure-storage-blob pyarrow

          python tools/bootstrap_model.py \
            --storage-account $(storageAccountName) \
            --container $(blobContainerName) \
            --models-prefix models/omx30/horizon=7 \
            --features-prefix curated/omx30/features/horizon=7
